################################################################
# GENERAL CONFIG
################################################################

general_config:
  version: exp_05_hyperparameter_search
  dataset_version: v1
  random_seed: 42

  paths:
    raw_data: data/raw/{version}/shock.csv
    cleaned_data: data/processed/{version}/cleaned.parquet
    training_data: data/processed/{version}/training.parquet
    splits_dir: data/splits/{version}
    model_output: output/{pipeline_version}/models/{model_name}/model.joblib
    evaluation_output: output/{pipeline_version}/models/{model_name}/{model_name}_evaluation.json
    eda_plots: output/{pipeline_version}/eda_plots
    eval_plots: output/{pipeline_version}/models/{model_name}/plots
    output_base: output/{pipeline_version}

logging:
  level: INFO
  log_dir: logs
experiment_metadata:
  stage: base_features
  description: "Baseline with original preop/intraop features only, default configuration for multiple models. Tests model performance without engineered features."

# FEATURE AND CLEANING

features:
  target_name: SHOCK
  numerical_features:
    - EDAD
    - HB_PREQX
  binary_features:
    - GENERO
    - SANGRADO_MAYOR
    - ACT_FISICA_METS
    - HIPERTENSION
    - DIABETES
    - ENFERMEDAD_CORONARIA
    - FALLA_CARDIACA
    - HIPOTIROIDISMO
    - ERC
    - INMUNOSUPRESION
    - OBESIDAD
    - HIPERTENSION_PULMONAR
    - EPOC
    - ASMA
    - ENF_CEREBROVASCULAR
    - CANCER_ACTIVO
    - TABAQUISMO

  aggregated_features:
    CARGA_CARDIOVASCULAR:
      enabled: true
      operation: sum
      components:
        - HIPERTENSION
        - ENFERMEDAD_CORONARIA
        - FALLA_CARDIACA
        - ENF_CEREBROVASCULAR
    CARGA_PULMONAR:
      enabled: true
      operation: sum
      components:
        - EPOC
        - ASMA
        - HIPERTENSION_PULMONAR
        - TABAQUISMO
    SINDROME_METABOLICO:
      enabled: true
      operation: sum
      components:
        - OBESIDAD
        - HIPERTENSION
        - DIABETES
  
  categorical_features:
    EDAD_CAT:
      enabled: false
      source_variable: EDAD
      thresholds: [5, 12, 15, 65]
      categories:
        - { label: "PRIMERA_INFANCIA", value: 0 }
        - { label: "NINOS", value: 1 }
        - { label: "ADOLESCENTES", value: 2 }
        - { label: "ADULTOS", value: 3 }
        - { label: "ADULTOS_MAYORES", value: 4 }
    HB_CAT:
      enabled: false
      source_variable: HB_PREQX
      thresholds: [8.0, 11.0, 13.0]
      categories:
        - { label: "ANEMIA_GRAVE", value: 0 }
        - { label: "ANEMIA_MODERADA", value: 1 }
        - { label: "ANEMIA_LEVE", value: 2 }
        - { label: "OPTIMO", value: 3 }

cleaning:
  exclude_columns:
    - MUERTE.1
    - CODIGO
  validation_rules:
    binary_values:
      valid: [0, 1]
    valid_ranges:
      EDAD:
        min: 0
        max: 120
      HB_PREQX:
        min: 0
        max: 100.0

# MODELS AND TRAINING 

data_split:
  test_size: 0.1
  shuffle: true
  stratify: true

models:
  logistic_regression_lasso:
    enabled: true
    module: sklearn.linear_model
    class: LogisticRegression
    target_recall: 0.80
    params:
      penalty: l2
      solver: lbfgs
      max_iter: 10000
      C: 0.001
      class_weight: null
    search_space:
      C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
      class_weight: [null, balanced]

  lightgbm:
    enabled: true
    module: lightgbm
    class: LGBMClassifier
    target_recall: 0.85
    params:
      verbosity: -1
      n_estimators: 100
      learning_rate: 0.01
      max_depth: 5
      num_leaves: 31
      min_child_samples: 20
      subsample: 1.0
      colsample_bytree: 1.0
      scale_pos_weight: 2.0
    search_space:
      n_estimators: [100, 300, 500, 800]
      learning_rate: [0.01, 0.03, 0.05, 0.1]
      max_depth: [3, 5, 7, -1]
      num_leaves: [15, 31, 63, 127]
      min_child_samples: [10, 20, 50, 100]
      subsample: [0.6, 0.8, 1.0]
      colsample_bytree: [0.6, 0.8, 1.0]
      scale_pos_weight: [1.0, 1.5, 2.0, 3.0]

  decision_tree:
    enabled: true
    module: sklearn.tree
    class: DecisionTreeClassifier
    target_recall: 0.80
    params:
      max_depth: 7
      min_samples_split: 10
      min_samples_leaf: 20
      criterion: gini
      class_weight: null
    search_space:
      max_depth: [3, 5, 7, 10, null]
      min_samples_split: [2, 5, 10, 20, 50]
      min_samples_leaf: [1, 5, 10, 20]
      criterion: [gini, entropy]
      class_weight: [null, balanced]

  random_forest:
    enabled: true
    module: sklearn.ensemble
    class: RandomForestClassifier
    target_recall: 0.80
    params:
      n_jobs: -1
      n_estimators: 300
      max_depth: 5
      min_samples_split: 10
      min_samples_leaf: 20
      max_features: null
      class_weight: balanced
    search_space:
      n_estimators: [100, 300, 500, 800]
      max_depth: [3, 5, 7, 10, null]
      min_samples_split: [2, 5, 10, 20]
      min_samples_leaf: [1, 5, 10, 20]
      max_features: [sqrt, log2, null]
      class_weight: [null, balanced, balanced_subsample]

  xgboost:
    enabled: true
    module: xgboost
    class: XGBClassifier
    target_recall: 0.85
    params:
      verbosity: 0
      n_estimators: 500
      max_depth: 7
      learning_rate: 0.01
      subsample: 1.0
      colsample_bytree: 0.6
      scale_pos_weight: 3.0
      gamma: 5.0
      reg_alpha: 0
      reg_lambda: 1.0
    search_space:
      n_estimators: [100, 300, 500, 800]
      max_depth: [3, 5, 7]
      learning_rate: [0.01, 0.03, 0.05, 0.1]
      subsample: [0.6, 0.8, 1.0]
      colsample_bytree: [0.6, 0.8, 1.0]
      scale_pos_weight: [1.0, 1.5, 2.0, 3.0]
      gamma: [0, 0.1, 1.0, 5.0]
      reg_alpha: [0, 0.1, 1.0, 5.0]
      reg_lambda: [0, 0.1, 1.0, 5.0]

  catboost:
    enabled: true
    module: catboost
    class: CatBoostClassifier
    target_recall: 0.80
    params:
      verbose: 0
      iterations: 100
      learning_rate: 0.01
      depth: 5
      l2_leaf_reg: 1
      auto_class_weights: None
    search_space:
      iterations: [100, 300, 500, 800]
      depth: [3, 5, 7, 9]
      learning_rate: [0.01, 0.03, 0.05, 0.1]
      l2_leaf_reg: [1, 3, 5, 10]
      auto_class_weights: [Balanced, SqrtBalanced, None]

  naive_bayes:
    enabled: true
    module: sklearn.naive_bayes
    class: GaussianNB
    target_recall: 0.80
    params:
      var_smoothing: 0.1
    search_space:
      var_smoothing: [1.0e-11, 1.0e-10, 1.0e-9, 1.0e-8, 1.0e-7, 1.0e-5, 1.0e-3, 1.0e-1]

feature_pruning:
  enabled: true
  min_total_ones: 10

cross_validation:
  n_folds: 5
  scale_features: true
  n_jobs: -1

hyperparameter_search:
  enabled: false
  n_iter: 70
  cv_folds: 10
  scoring: roc_auc
  n_jobs: -1
  verbose: 1

threshold_optimization:
  search_thresholds: [0.20, 0.55, 0.01]
  test_thresholds: [0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
  permutation_n: 200
visualization:
  dpi: 150
  figure_size: [10, 6]
