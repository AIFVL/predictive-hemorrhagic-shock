general_config:
  version: exp01_base_lr
  dataset_version: v1
  random_seed: 42
  paths:
    raw_data: data/raw/{version}/shock.csv
    cleaned_data: data/processed/{version}/cleaned.parquet
    training_data: data/processed/{version}/training.parquet
    splits_dir: data/splits/{version}
    model_output: output/{pipeline_version}/models/{model_name}/model.joblib
    evaluation_output: output/{pipeline_version}/evaluation/{model_name}/evaluation.json
    eda_plots: output/{pipeline_version}/eda_plots
    eval_plots: output/{pipeline_version}/{model_name}/model_plots
    output_base: output/{pipeline_version}
features:
  target_name: SHOCK
  numerical_features:
    - EDAD
    - HB_PREQX
  binary_features:
    - GENERO
    - ACT_FISICA_METS
    - HIPERTENSION
    - DIABETES
    - ENFERMEDAD_CORONARIA
    - FALLA_CARDIACA
    - HIPOTIROIDISMO
    - ERC
    - INMUNOSUPRESION
    - OBESIDAD
    - HIPERTENSION_PULMONAR
    - EPOC
    - ASMA
    - ENF_CEREBROVASCULAR
    - CANCER_ACTIVO
    - TABAQUISMO
  aggregated_features: {}
  categorical_features: {}
cleaning:
  exclude_columns:
    - MUERTE.1
    - CODIGO
  validation_rules:
    binary_values:
      valid: [0, 1]
    valid_ranges:
      EDAD:
        min: 18
        max: 120
      HB_PREQX:
        min: 3.0
        max: 20.0
data_split:
  test_size: 0.2
  shuffle: true
  stratify: true
models:
  logistic_regression:
    enabled: true
    module: sklearn.linear_model
    class: LogisticRegression
    target_recall: 0.80
    params:
      C: 0.5
      penalty: l2
      solver: lbfgs
      l1_ratio: null
      class_weight:
        0: 1
        1: 4
      max_iter: 2000
      random_state: 42
      n_jobs: null
    search_space:
      C: [0.5, 0.1, 1.0, 10.0]
      penalty: [l2]
      solver: [lbfgs]
      l1_ratio: [null]
      class_weight:
        - {0: 1, 1: 4}
      max_iter: [2000]
      random_state: [42]
      n_jobs: [null]
  lightgbm:
    enabled: false
    module: lightgbm
    class: LGBMClassifier
    target_recall: 0.85
    params:
      n_estimators: 200
      learning_rate: 0.03
      num_leaves: 63
      max_depth: 5
      min_child_samples: 20
      subsample: 0.6
      colsample_bytree: 0.6
      min_split_gain: 0.0
      reg_alpha: 0.1
      reg_lambda: 5.0
      scale_pos_weight: 3.0
      objective: binary
      random_state: 42
      n_jobs: -1
      boosting_type: gbdt
      min_data_in_leaf: 50
      path_smooth: 1.0
    search_space: {}
  decision_tree:
    enabled: false
    module: sklearn.tree
    class: DecisionTreeClassifier
    target_recall: 0.80
    params:
      criterion: gini
      max_depth: 5
      min_samples_split: 20
      min_samples_leaf: 10
      max_features: null
      class_weight: balanced
      random_state: 42
    search_space: {}
  naive_bayes:
    enabled: false
    module: sklearn.naive_bayes
    class: GaussianNB
    target_recall: 0.80
    params:
      var_smoothing: 1.0e-9
    search_space: {}
feature_pruning:
  enabled: true
  min_total_ones: 10
cross_validation:
  n_folds: 5
  scale_features: true
  n_jobs: -1
hyperparameter_search:
  enabled: false
  n_iter: 70
  cv_folds: 10
  scoring: f2
  n_jobs: -1
  verbose: 1
threshold_optimization:
  search_thresholds: [0.20, 0.55, 0.01]
  test_thresholds: [0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
  permutation_n: 200
visualization:
  dpi: 150
  figure_size: [10, 6]
logging:
  level: INFO
  log_dir: logs
experiment_metadata:
  stage: base_features
  description: "Baseline with original preop/intraop features only (EDAD, HB_PREQX plus 16 binary comorbidity indicators). Tests model performance without engineered features."
