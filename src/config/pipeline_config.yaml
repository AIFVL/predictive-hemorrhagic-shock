# ==============================================================================
# Pipeline Configuration for Hemorrhagic Shock Prediction
# ==============================================================================
# This file contains all pipeline execution parameters.
# Version this file along with your code for reproducibility.
# ==============================================================================

# Data version
version: "v10"

# Random seed for reproducibility
random_seed: 42

# ------------------------------------------------------------------------------
# DATA PATHS (relative to project root)
# ------------------------------------------------------------------------------
paths:
  raw_data: "data/raw/{version}/shock.csv"
  cleaned_data: "data/processed/{version}/cleaned.parquet"
  training_data: "data/processed/{version}/training.parquet"
  splits_dir: "data/splits/{version}"
  # Model outputs - {model_name} will be replaced with each model's name
  model_output: "models/{version}/{model_name}/model.joblib"
  evaluation_output: "data/output/{version}/evaluation/{model_name}/evaluation.json"
  eda_plots: "data/output/{version}/eda_plots"
  eval_plots: "data/output/{version}/{model_name}/model_plots"
  feature_config: "src/config/feature_config.yaml"
  output_base: "data/output/{version}"

# ------------------------------------------------------------------------------
# DATA CLEANING
# ------------------------------------------------------------------------------
cleaning:
  output_format: "parquet"  # parquet or csv
  save_report: true
  filters:
    # Age filters
    min_age: 18
    max_age: 120
    # Hemoglobin filters
    min_hemoglobin: 3.0
    max_hemoglobin: 20.0
  # Variables to exclude
  leakage_variables:
    - MUERTE.1  # Event occurring after target variable
    - SANGRADO_MAYOR  # Post-operative bleeding
  identifier_columns:
    - CODIGO
    - codigo

# ------------------------------------------------------------------------------
# TRAIN/TEST SPLIT
# ------------------------------------------------------------------------------
data_split:
  test_size: 0.2
  stratify: true  # Stratify by target variable
  shuffle: true

# ------------------------------------------------------------------------------
# MODELS
# ------------------------------------------------------------------------------
models:
  logistic_regression:
    module: "sklearn.linear_model"
    class: "LogisticRegression"
    params:
      solver: "lbfgs"
      penalty: "l2"
      max_iter: 2000
      class_weight: {0: 1, 1: 3}
      C: 0.01
      random_state: 42

  random_forest:
    module: "sklearn.ensemble"
    class: "RandomForestClassifier"
    params:
      n_estimators: 300
      max_depth: 12
      min_samples_split: 4
      min_samples_leaf: 3
      max_features: "sqrt"
      bootstrap: true
      class_weight: {0: 1, 1: 2.5}
      random_state: 42
      n_jobs: -1

  gradient_boosting:
    module: "sklearn.ensemble"
    class: "GradientBoostingClassifier"
    params:
      n_estimators: 150
      max_depth: 4
      learning_rate: 0.08
      min_samples_split: 6
      min_samples_leaf: 4
      subsample: 0.8
      random_state: 42

  knn:
    module: "sklearn.neighbors"
    class: "KNeighborsClassifier"
    params:
      n_neighbors: 15
      weights: "distance"
      metric: "minkowski"

  lightgbm:
    module: "lightgbm"
    class: "LGBMClassifier"
    params:
      n_estimators: 300
      learning_rate: 0.05
      num_leaves: 31
      max_depth: -1
      min_child_samples: 20
      subsample: 0.8
      colsample_bytree: 0.8
      scale_pos_weight: 2.1   # ≈ 710 / 335
      objective: "binary"
      random_state: 42
      n_jobs: -1

# ------------------------------------------------------------------------------
# CROSS VALIDATION
# ------------------------------------------------------------------------------
cross_validation:
  n_folds: 5
  stratified: true
  scale_features: true
  scoring: "f2"  # F2 prioriza recall sobre precision
  metrics:
    - precision
    - recall
    - f1
    - f2
    - roc_auc
    - average_precision

# ------------------------------------------------------------------------------
# HYPERPARAMETER SEARCH
# ------------------------------------------------------------------------------
hyperparameter_search:
  enabled: true
  method: "random"
  n_iter: 70
  cv_folds: 5
  scoring: "f2"
  n_jobs: -1
  random_state: 42

  search_spaces:
    logistic_regression:
      C: [0.001, 0.01, 0.05, 0.1, 0.5]
      class_weight:
        - {0: 1, 1: 2}
        - {0: 1, 1: 3}
        - "balanced"

    random_forest:
      n_estimators: [400, 500]
      max_depth: [6, 8, 10]
      min_samples_leaf: [4, 6, 8]
      min_samples_split: [6, 8, 10]
      max_features: ["sqrt", 0.6, 0.7]
      class_weight:
        - {0: 1, 1: 3.8}
        - {0: 1, 1: 4}
        - {0: 1, 1: 4.2}

    gradient_boosting:
      n_estimators: [100, 150, 200]
      max_depth: [3, 4, 5]
      learning_rate: [0.03, 0.05, 0.08]
      subsample: [0.7, 0.8]

    knn:
      n_neighbors: [5, 10, 15, 20, 30]
      weights: ["uniform", "distance"]

    lightgbm:
      n_estimators: [200, 300, 500]
      learning_rate: [0.03, 0.05, 0.1]
      num_leaves: [15, 31, 63]
      min_child_samples: [10, 20, 40]
      subsample: [0.7, 0.8]
      colsample_bytree: [0.7, 0.8]

# ------------------------------------------------------------------------------
# THRESHOLD OPTIMIZATION (VALIDATION / CV ONLY)
# ------------------------------------------------------------------------------
evaluation:
  threshold_optimization:
    enabled: true
    optimize_on: "validation"  # IMPORTANT: never test
    search_thresholds: [0.20, 0.55, 0.01]  # Rango ajustado
    target_recalls:
      logistic_regression: 0.90
      random_forest: 0.90
      gradient_boosting: 0.90
      lightgbm: 0.90
      knn: 0.90
    default_threshold: 0.5
    
    # Thresholds para reportes comparativos en TEST
    test_thresholds: [0.25, 0.30, 0.35, 0.40, 0.45, 0.50]

  report_on_test:
    use_fixed_threshold: true
    metrics:
      - precision
      - recall
      - f1
      - f2
      - roc_auc
      - average_precision

# ------------------------------------------------------------------------------
# VISUALIZATION
# ------------------------------------------------------------------------------
visualization:
  eda_plots:
    - univariate_distributions
    - target_distribution
    - correlation_matrix
    - missing_values_heatmap
    - feature_importance_preview
  
  evaluation_plots:
    - confusion_matrix
    - roc_curve
    - precision_recall_curve
    - calibration_curve
    - threshold_analysis
    - feature_importance
  
  plot_format: "png"
  dpi: 300
  figure_size: [10, 6]

# ------------------------------------------------------------------------------
# MLFLOW TRACKING
# ------------------------------------------------------------------------------
mlflow:
  enabled: true
  experiment_name: "shock_prediction"
  run_name: "pipeline_{version}_{timestamp}"
  tracking_uri: "file:./mlruns"
  
  # What to log
  log_params: true
  log_metrics: true
  log_artifacts: true
  log_model: true
  
  # Tags
  tags:
    project: "hemorrhagic_shock_prediction"
    institution: "Fundación Valle del Lili"
    model_type: "random_forest"

# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  log_dir: "logs"
