# ==============================================================================
# Pipeline Configuration for Hemorrhagic Shock Prediction
# ==============================================================================
# This file contains all pipeline execution parameters.
# Version this file along with your code for reproducibility.
# ==============================================================================

# Data version
version: "v11"

# Random seed for reproducibility
random_seed: 42

# ------------------------------------------------------------------------------
# DATA PATHS (relative to project root)
# ------------------------------------------------------------------------------
paths:
  raw_data: "data/raw/{version}/shock.csv"
  cleaned_data: "data/processed/{version}/cleaned.parquet"
  training_data: "data/processed/{version}/training.parquet"
  splits_dir: "data/splits/{version}"
  # Model outputs - {model_name} will be replaced with each model's name
  model_output: "models/{version}/{model_name}/model.joblib"
  evaluation_output: "data/output/{version}/evaluation/{model_name}/evaluation.json"
  eda_plots: "data/output/{version}/eda_plots"
  eval_plots: "data/output/{version}/{model_name}/model_plots"
  feature_config: "src/config/feature_config.yaml"
  output_base: "data/output/{version}"

# ------------------------------------------------------------------------------
# DATA CLEANING
# ------------------------------------------------------------------------------
cleaning:
  output_format: "parquet" # parquet or csv
  save_report: true
  filters:
    # Age filters
    min_age: 18
    max_age: 120
    # Hemoglobin filters
    min_hemoglobin: 3.0
    max_hemoglobin: 20.0
  # Variables to exclude
  leakage_variables:
    - MUERTE.1 # Event occurring after target variable
    - SANGRADO_MAYOR # Post-operative bleeding
  identifier_columns:
    - CODIGO
    - codigo

# ------------------------------------------------------------------------------
# TRAIN/TEST SPLIT
# ------------------------------------------------------------------------------
data_split:
  test_size: 0.2
  stratify: true # Stratify by target variable
  shuffle: true

# ------------------------------------------------------------------------------
# MODELS
# ------------------------------------------------------------------------------
models:
  lightgbm:
    module: "lightgbm"
    class: "LGBMClassifier"
    params:
      n_estimators: 300
      learning_rate: 0.05
      num_leaves: 31
      max_depth: -1
      min_child_samples: 20
      subsample: 0.8
      colsample_bytree: 0.8
      scale_pos_weight: 2.1 # ≈ negatives / positives
      objective: "binary"
      random_state: 42
      n_jobs: -1

# ------------------------------------------------------------------------------
# FEATURE PRUNING (leakage-safe: fit inside CV)
# Drops binary columns with extremely low prevalence (unstable splits)
# ------------------------------------------------------------------------------
feature_pruning:
  enabled: true
  min_total_ones: 10

# ------------------------------------------------------------------------------
# ASSOCIATION RULE FEATURE GENERATION (fit inside CV to avoid leakage)
# ------------------------------------------------------------------------------
association_rules:
  enabled: true
  # Mine rules of the form: antecedent -> shock=1 (uses y during fit, so MUST be inside Pipeline/CV)
  min_support: 0.01 # 50% más sensible vs 0.02 (más reglas candidatas)
  min_confidence: 0.30
  min_lift: 1.02
  max_rules: 180
  max_antecedent_size: 2 # keep conservative to reduce overfitting

  # How to convert continuous variables (e.g., edad, hemoglobina) into items
  binning_strategy: "quantile"
  n_bins: 4
  add_missing_as_item: true
  # Optional override; if omitted, uses feature_config numerical features
  # continuous_columns: ["EDAD", "HEMOGLOBINA"]

# ------------------------------------------------------------------------------
# CROSS VALIDATION
# ------------------------------------------------------------------------------
cross_validation:
  n_folds: 5
  stratified: true
  scale_features: false
  scoring: "f2" # F2 prioriza recall sobre precision
  metrics:
    - precision
    - recall
    - f1
    - f2
    - roc_auc
    - average_precision

# ------------------------------------------------------------------------------
# HYPERPARAMETER SEARCH
# ------------------------------------------------------------------------------
hyperparameter_search:
  enabled: true
  method: "random"
  n_iter: 70
  cv_folds: 5
  scoring: "f2"
  n_jobs: -1
  random_state: 42

  search_spaces:
    lightgbm:
      n_estimators: [200, 400, 800]
      learning_rate: [0.01, 0.03, 0.05, 0.10]
      num_leaves: [15, 31, 63, 127]
      max_depth: [-1, 3, 5, 7]
      min_child_samples: [10, 20, 40, 80]
      subsample: [0.6, 0.8, 1.0]
      colsample_bytree: [0.6, 0.8, 1.0]
      min_split_gain: [0.0, 0.01, 0.05]
      reg_alpha: [0.0, 0.1, 1.0]
      reg_lambda: [0.0, 0.1, 1.0, 5.0]
      scale_pos_weight: [1.5, 2.1, 2.5, 3.0]

# ------------------------------------------------------------------------------
# THRESHOLD OPTIMIZATION (VALIDATION / CV ONLY)
# ------------------------------------------------------------------------------
evaluation:
  threshold_optimization:
    enabled: true
    optimize_on: "validation" # IMPORTANT: never test
    search_thresholds: [0.20, 0.55, 0.01] # Rango ajustado
    target_recalls:
      lightgbm: 0.90
    default_threshold: 0.5

    # Thresholds para reportes comparativos en TEST
    test_thresholds: [0.25, 0.30, 0.35, 0.40, 0.45, 0.50]

  report_on_test:
    use_fixed_threshold: true
    metrics:
      - precision
      - recall
      - f1
      - f2
      - roc_auc
      - average_precision

# ------------------------------------------------------------------------------
# VISUALIZATION
# ------------------------------------------------------------------------------
visualization:
  eda_plots:
    - univariate_distributions
    - target_distribution
    - correlation_matrix
    - missing_values_heatmap
    - feature_importance_preview

  evaluation_plots:
    - confusion_matrix
    - roc_curve
    - precision_recall_curve
    - calibration_curve
    - threshold_analysis
    - feature_importance

  plot_format: "png"
  dpi: 300
  figure_size: [10, 6]

# ------------------------------------------------------------------------------
# MLFLOW TRACKING
# ------------------------------------------------------------------------------
mlflow:
  enabled: true
  experiment_name: "shock_prediction"
  run_name: "pipeline_{version}_{timestamp}"
  tracking_uri: "file:./mlruns"

  # What to log
  log_params: true
  log_metrics: true
  log_artifacts: true
  log_model: true

  # Tags
  tags:
    project: "hemorrhagic_shock_prediction"
    institution: "Fundación Valle del Lili"
    model_type: "random_forest"

# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  log_dir: "logs"
