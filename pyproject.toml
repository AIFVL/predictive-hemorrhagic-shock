[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "shock"
version = "0.1.0"
description = "Shock hemorragico prediction project with MLflow integration"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
pandas = "^2.1.4"
numpy = "^1.26.2"
python-decouple = "^3.8"
pyyaml = "^6.0.1"
loguru = "^0.7.2"
sqlalchemy = "^2.0.23"
psycopg2-binary = "^2.9.9"
pymongo = "^4.6.1"
boto3 = "^1.34.14"
azure-storage-blob = "^12.19.0"
google-cloud-storage = "^2.14.0"
matplotlib = "^3.8.2"
seaborn = "^0.13.0"
plotly = "^5.18.0"
great-expectations = "^0.18.8"
joblib = "^1.5.2"
scikit-learn = "^1.7.2"
imblearn = "^0.0"
mlflow = "^2.22.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
black = "^23.12.1"
ruff = "^0.1.9"
mypy = "^1.8.0"
ipython = "^8.19.0"

[tool.poetry.group.notebook.dependencies]
jupyter = "^1.0.0"
ipykernel = "^6.28.0"

[tool.poetry.scripts]
shock-etl = "src.etl.example_etl:main"
shock-analysis = "src.analysis.example_analysis:main"
shock-create-data = "src.scripts.create_sample_data:main"
shock-pipeline = "src.pipelines.shock_pipeline:main"
shock-eda = "src.pipelines.eda_pipeline:main"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers --disable-warnings"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
